<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a3d"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <clipPath id="win" clipPathUnits="userSpaceOnUse"><rect width="70" height="52" rx="7"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3" result="blur"/>
      <feFlood flood-color="#000" flood-opacity=".45"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- back window: Nord -->
  <g transform="translate(46 14)" filter="url(#sh)">
    <g clip-path="url(#win)">
      <rect width="70" height="52" fill="#2e3440"/>
      <rect width="70" height="11" fill="#88c0d0"/>
      <rect y="11" width="9" height="41" fill="#3b4252"/>
      <rect x="15" y="19" width="22" height="3.5" rx="1.75" fill="#81a1c1"/>
      <rect x="15" y="27" width="34" height="3.5" rx="1.75" fill="#a3be8c"/>
      <rect y="46" width="70" height="6" fill="#5e81ac"/>
    </g>
  </g>

  <!-- middle window: Gruvbox -->
  <g transform="translate(30 38)" filter="url(#sh)">
    <g clip-path="url(#win)">
      <rect width="70" height="52" fill="#282828"/>
      <rect width="70" height="11" fill="#fe8019"/>
      <rect y="11" width="9" height="41" fill="#1d2021"/>
      <rect x="15" y="19" width="18" height="3.5" rx="1.75" fill="#fb4934"/>
      <rect x="36" y="19" width="20" height="3.5" rx="1.75" fill="#b8bb26"/>
      <rect x="15" y="27" width="30" height="3.5" rx="1.75" fill="#fabd2f"/>
      <rect y="46" width="70" height="6" fill="#d65d0e"/>
    </g>
  </g>

  <!-- front window: Dracula -->
  <g transform="translate(12 62)" filter="url(#sh)">
    <g clip-path="url(#win)">
      <rect width="70" height="52" fill="#282a36"/>
      <rect width="70" height="11" fill="#bd93f9"/>
      <circle cx="7" cy="5.5" r="2" fill="#282a36" fill-opacity=".55"/>
      <circle cx="13" cy="5.5" r="2" fill="#282a36" fill-opacity=".55"/>
      <rect y="11" width="9" height="41" fill="#21222c"/>
      <rect x="15" y="18" width="14" height="3.5" rx="1.75" fill="#ff79c6"/>
      <rect x="32" y="18" width="22" height="3.5" rx="1.75" fill="#50fa7b"/>
      <rect x="21" y="26" width="26" height="3.5" rx="1.75" fill="#8be9fd"/>
      <rect x="21" y="34" width="18" height="3.5" rx="1.75" fill="#f1fa8c"/>
      <rect y="46" width="70" height="6" fill="#ff79c6"/>
    </g>
  </g>
</svg>
