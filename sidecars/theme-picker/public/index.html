<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Window Themes</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- Antigravity sidecar bridge: defines window.sidecar -->
  <script src="/preload.js"></script>
  <!-- Adds window.sidecar.getWorkspaceUris() -->
  <script src="/workspace.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="ws" aria-live="polite">
      <div class="ws-eyebrow">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.2l1.6 1.6H13A1.5 1.5 0 0 1 14.5 5v7.5A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        <span>Current window</span>
        <span id="ws-source" class="chip" hidden></span>
      </div>
      <div class="ws-row">
        <h1 id="ws-name" class="ws-name">Detecting workspace…</h1>
        <button id="ws-change" class="btn ghost small" type="button" aria-expanded="false" aria-controls="ws-picker">Change</button>
      </div>
      <div id="ws-path" class="ws-path"></div>

      <div id="ws-picker" class="ws-picker" hidden>
        <label class="field-label" for="ws-select">Apply themes to</label>
        <select id="ws-select" class="input"></select>
        <form id="ws-manual" class="ws-manual" hidden>
          <input id="ws-manual-input" class="input mono" type="text" placeholder="/absolute/path/to/project" spellcheck="false" autocomplete="off">
          <button class="btn small" type="submit">Use folder</button>
        </form>
      </div>

      <div id="current" class="current" hidden>
        <div class="current-swatches" id="current-swatches"></div>
        <div class="current-text">
          <div class="current-label">Applied theme</div>
          <div class="current-name" id="current-name"></div>
        </div>
        <button id="remove" class="btn ghost small" type="button" title="Restore this window's previous colors">Remove</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-library" data-tab="library" aria-selected="true" aria-controls="library-view">
        Themes <span id="tab-count" class="tab-count"></span>
      </button>
      <button type="button" role="tab" id="tab-discover" data-tab="discover" aria-selected="false" aria-controls="discover-view" tabindex="-1">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 8h12M8 2c-2.2 2.4-2.2 9.6 0 12M8 2c2.2 2.4 2.2 9.6 0 12" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        Find more
      </button>
    </nav>

    <section id="library-view" class="view" role="tabpanel" aria-labelledby="tab-library">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search themes" aria-label="Search themes" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <div class="toolbar-row">
          <div id="kind-filter" class="chips" role="group" aria-label="Filter by type">
            <button type="button" data-kind="all" aria-pressed="true">All</button>
            <button type="button" data-kind="dark" aria-pressed="false">Dark</button>
            <button type="button" data-kind="light" aria-pressed="false">Light</button>
            <button type="button" data-kind="hc" aria-pressed="false">High contrast</button>
          </div>
          <span id="count" class="count"></span>
        </div>
        <div class="toolbar-row">
          <div id="scope" class="seg" role="group" aria-label="What to recolor">
            <button type="button" data-scope="full" aria-pressed="true" title="Workbench colors and syntax highlighting">Full theme</button>
            <button type="button" data-scope="frame" aria-pressed="false" title="Only the title bar, activity bar and status bar">Frame only</button>
          </div>
          <span id="scope-hint" class="hint"></span>
        </div>
      </div>

      <main id="grid" class="grid" role="listbox" aria-label="Themes" tabindex="-1"></main>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section id="discover-view" class="view" role="tabpanel" aria-labelledby="tab-discover" hidden>
      <div class="toolbar">
        <form id="discover-form" class="search" role="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="discover-input" type="search" placeholder="Search Open VSX or paste a link" aria-label="Search for themes online" autocomplete="off" spellcheck="false">
        </form>
        <p class="hint discover-hint">
          Searches the <a href="https://open-vsx.org/?category=Themes" target="_blank" rel="noopener">Open VSX</a> theme registry.
          You can also paste an Open VSX, Marketplace or GitHub link, or the URL of a theme <code>.json</code> file.
        </p>
      </div>
      <div id="discover-body" class="discover-body">
        <details id="my-sources" class="my-sources" hidden>
          <summary>Added by you <span id="my-count" class="tab-count"></span></summary>
          <ul id="my-list" class="my-list"></ul>
        </details>
        <div id="discover-heading" class="list-heading"></div>
        <ul id="results" class="results" aria-label="Search results"></ul>
        <div id="discover-empty" class="empty" hidden></div>
        <button id="more" class="btn more" type="button" hidden>Load more</button>
      </div>
    </section>

    <footer class="actions">
      <div class="selected" id="selected">
        <div class="selected-swatches" id="selected-swatches"></div>
        <div class="selected-text">
          <div class="selected-name" id="selected-name">No theme selected</div>
          <div class="selected-sub" id="selected-sub">Pick a theme above</div>
        </div>
      </div>
      <div class="buttons">
        <button id="random" class="btn" type="button" title="Pick a theme that looks different from your other windows">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="5.5" r="1.1" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg>
          <span class="long">Randomize distinct</span><span class="short">Random</span>
        </button>
        <button id="apply" class="btn primary" type="button" disabled><span class="long">Apply to current window</span><span class="short">Apply</span></button>
      </div>
      <div class="catalog-line">
        <span id="catalog-info">Loading catalog…</span>
        <button id="refresh" class="link" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Refresh
        </button>
      </div>
      <div class="progress" id="progress" hidden><div id="progress-bar"></div></div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
